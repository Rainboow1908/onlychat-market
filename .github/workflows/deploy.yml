name: Deploy market

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Verifies every package signature with the committed public key.
      # If ONLYCHAT_MARKET_SEED is configured, a package that has no .sig yet
      # is signed; a digest/signature mismatch is always fatal.
      - name: Verify (and optionally sign) packages
        env:
          ONLYCHAT_MARKET_SEED: ${{ secrets.ONLYCHAT_MARKET_SEED }}
          ONLYCHAT_MARKET_PUBLIC_KEY: ${{ vars.ONLYCHAT_MARKET_PUBLIC_KEY }}
        run: node .github/scripts/verify-signatures.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name onlychat-market
